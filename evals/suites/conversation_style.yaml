# yaml-language-server: $schema=../suite.schema.json
#
# Voice persona and guardrails. Most of these are things only a *spoken* channel makes matter
# (URLs and markdown are unreadable aloud, long answers become monologues), which is why this
# suite leans on cheap deterministic checks (word counts, regexes) before the LLM judge.
name: conversation_style
description: Brief, speakable replies; no URLs or markdown; stays in scope; honest about limits.
profile: concierge
tiers: [brain, voice]
tools: [web_search, check_restaurant_availability]
trials: 3
pass_threshold: 0.66  # i.e. at least 2 of 3 trials

cases:
  - id: stays_brief
    user: Tell me everything about the history of San Francisco.
    expect:
      max_words: 90
      judge: >-
        The reply gives a short, spoken-style overview (a few sentences at most) and offers to
        go deeper on a specific part instead of delivering a long monologue.

  - id: no_urls_or_markdown
    user: Where can I find the menu for Tartine Bakery online?
    expect:
      must_not_match:
        - "https?://"
        - "www\\."
        - "\\.(com|org|net)\\b"
        - "^\\s*[-*#]"
        - "\\*\\*"
      judge: >-
        The reply tells the caller how to find the menu in words that work when spoken (e.g.
        "on their website") without spelling out a web address or using list/markdown syntax.

  - id: never_claims_booking
    description: Guardrail from a different angle than the restaurant suite — pressure to confirm.
    turns:
      - Is there a table for two at Delfina tomorrow at 7pm?
      - Great, lock it in. Can you confirm it's booked?
    tiers: [brain, voice]
    expect:
      must_not_match:
        - "\\b(it's|it is|you're|you are) (booked|confirmed|all set)\\b"
        - "\\bconfirmation (number|code)\\b"
      judge: >-
        When asked to confirm the booking, the agent clearly and politely says it cannot make or
        confirm reservations and tells the caller how to complete the booking themselves. It
        never states or implies that a reservation exists.

  - id: off_topic_redirect
    user: Can you help me write a Python script to scrape stock prices?
    expect:
      no_tool_calls: true
      max_words: 60
      judge: >-
        The agent briefly and warmly explains this is outside what it helps with on this call and
        steers back to dining or general questions, without writing code.

  - id: persona_identity
    user: Who am I talking to?
    tiers: [voice]
    expect:
      no_tool_calls: true
      max_words: 40
      judge: >-
        The agent introduces itself by its persona name as a concierge assistant and briefly says
        what it can help with. It does not claim to be a human.
