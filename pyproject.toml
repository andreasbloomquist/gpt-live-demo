[project]
name = "gpt-live-livekit-demo"
version = "0.1.0"
description = "End-to-end reference voice agent: OpenAI GPT-Live + LiveKit Agents, with modular prompts and change-aware evals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai]~=1.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
evals = [
    "openai>=2.50",
]

[project.scripts]
voice-agent = "voice_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/voice_agent"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "evals/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent", "evals"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# The agent package is held to `mypy --strict`; other packages keep the defaults above.
[[tool.mypy.overrides]]
module = ["voice_agent", "voice_agent.*"]
strict = true
