# Paid model evals, gated by semantic change-impact detection.
#
#   plan ──► brain (matrix, cheap) ──► voice (matrix, expensive; only if brain passed) ──► report ──► comment
#
# Gates, cheapest first:
#   1. Fast path: `plan` finishes in seconds when no behavior-relevant file changed (docs,
#      frontend, CI), without rendering anything.
#   2. Change impact: `python -m evals.impact` fingerprints base vs head (rendered prompts, tool
#      schemas, normalized ASTs, settings defaults, lockfile) and emits the exact suite x tier
#      matrix. Whitespace, comment and docs-only edits plan nothing.
#   3. Spend gate: fork PRs, draft PRs and repos without OPENAI_API_KEY skip the paid jobs,
#      with a note in the report.
#   4. Brain must pass before any voice session is paid for.
#   5. A hard per-job USD budget inside the runner (`--max-cost-usd`).
#
# Trust model:
#   - Paid jobs run PR code with OPENAI_API_KEY. GitHub withholds secrets from fork PRs, so only
#     people with push access (who could edit this workflow anyway) can spend. Add required
#     reviewers to the `evals` environment to make every paid run wait for a maintainer.
#   - `plan` runs the BASE commit's planner, so a PR cannot rewrite the rules that judge it.
#   - Only `comment` holds a write token, and it runs no repository code.
#
# There is deliberately no `on.pull_request.paths` filter: GitHub applies it to `labeled`
# events too, so adding `evals:full` to a docs-only PR would never start the workflow.
#
# Overrides: PR labels `evals:full` (run everything) / `evals:skip` (run nothing);
# workflow_dispatch inputs; the nightly schedule runs everything on the default branch.
name: Evals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites, or 'all'"
        type: string
        default: all
      tiers:
        description: "Comma-separated tiers (brain,voice), or 'all'"
        type: string
        default: all
      force_all:
        description: "Ignore change detection and run the selected suites/tiers"
        type: boolean
        default: true
      max_cost_usd:
        description: "Hard budget per matrix job (USD)"
        type: string
        default: "5"
  schedule:
    - cron: "17 7 * * *" # nightly full run (off the hour to avoid scheduler congestion)

permissions:
  contents: read

concurrency:
  # One eval run per PR; a new push cancels the stale run. Label events for unrelated labels get
  # a unique group so they can never cancel a real run.
  group: >-
    evals-${{ github.event.pull_request.number || github.ref }}${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && !startsWith(github.event.label.name, 'evals:')
    && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  RESULTS_DIR: eval-results

jobs:
  plan:
    name: Plan (change impact)
    # Re-plan on label changes only for evals:* labels.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || startsWith(github.event.label.name, 'evals:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      brain_matrix: ${{ steps.plan.outputs.brain_matrix }}
      voice_matrix: ${{ steps.plan.outputs.voice_matrix }}
      brain_fingerprints: ${{ steps.plan.outputs.brain_fingerprints }}
      voice_fingerprints: ${{ steps.plan.outputs.voice_fingerprints }}
      run_brain: ${{ steps.plan.outputs.run_brain }}
      run_voice: ${{ steps.plan.outputs.run_voice }}
      any: ${{ steps.plan.outputs.any }}
      can_spend: ${{ steps.gate.outputs.can_spend }}
      gate_reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check out (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the detector exports the merge-base tree with `git archive`
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      - name: Resolve base ref
        id: refs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      # The planner decides which of a PR's evals run, so it must not be the PR's own code:
      # export evals/ from the BASE commit and run that copy. Two cases have no trustworthy
      # judge and force a full run: the base has no planner yet (bootstrap, so the head's
      # planner runs, forced), or the PR changes the planner or this workflow. The base's
      # planner enforces the second rule too (evals/impact/cli.py: PLANNER_PATHS).
      - name: Export trusted planner (base commit)
        id: planner
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          merge_base="$(git merge-base "$BASE" HEAD)"
          force=false
          if git cat-file -e "$BASE:evals/impact/cli.py" 2>/dev/null; then
            dir="$RUNNER_TEMP/trusted-planner"
            mkdir -p "$dir"
            git archive "$BASE" evals | tar -x -C "$dir"
          else
            dir="$GITHUB_WORKSPACE"
            force=true
          fi
          if ! git diff --quiet "$merge_base" HEAD -- evals/impact .github/workflows/evals.yml; then
            force=true
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Plan evals
        id: plan
        env:
          BASE: ${{ steps.refs.outputs.base }}
          PLANNER_DIR: ${{ steps.planner.outputs.dir }}
          # Label names are user-controlled: pass them via env, never interpolate into the script.
          EVALS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVALS_FORCE_ALL: ${{ steps.planner.outputs.force == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_all) }}
          # Same text as PLANNER_CHANGED in evals/impact/cli.py.
          EVALS_FORCE_REASON: "${{ steps.planner.outputs.force == 'true' && 'planner code changed: running everything' || '' }}"
          SUITES: ${{ inputs.suites || 'all' }}
          TIERS: ${{ inputs.tiers || 'all' }}
        # `python -m` from PLANNER_DIR imports that copy of `evals` (cwd comes first on sys.path;
        # the venv only adds agent/). It still fingerprints the full checkout via --repo.
        run: |
          cd "$PLANNER_DIR"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m evals.impact plan \
            --repo "$GITHUB_WORKSPACE" --base "$BASE" --head HEAD \
            --suites "$SUITES" --tiers "$TIERS" \
            --format github --output "$GITHUB_WORKSPACE/eval-plan.json"

      - name: Secrets gate
        id: gate
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          # Drafts churn: plan them (free) but don't pay until the PR is marked ready for review
          # (`ready_for_review` re-triggers this workflow). Apply `evals:full` to override.
          IS_DRAFT: ${{ github.event.pull_request.draft == true && !contains(github.event.pull_request.labels.*.name, 'evals:full') }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "can_spend=false" >> "$GITHUB_OUTPUT"
            echo "reason=PR from a fork: repository secrets are not available, paid evals skipped. A maintainer can push the branch to this repository and run them via workflow_dispatch." >> "$GITHUB_OUTPUT"
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "can_spend=false" >> "$GITHUB_OUTPUT"
            echo "reason=Draft PR: paid evals are planned but not run until the PR is ready for review (or labeled evals:full)." >> "$GITHUB_OUTPUT"
          else
            echo "can_spend=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-plan
          path: eval-plan.json
          retention-days: 30

  brain:
    name: Brain evals (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.run_brain == 'true' && needs.plan.outputs.can_spend == 'true'
    runs-on: ubuntu-latest
    environment: evals # holds OPENAI_API_KEY; add protection rules (e.g. required reviewers) here
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.brain_matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUITE: ${{ matrix.suite }}
      FINGERPRINTS: ${{ needs.plan.outputs.brain_fingerprints }}
      MAX_COST_USD: ${{ inputs.max_cost_usd || vars.EVALS_MAX_COST_USD || '3' }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies (with the evals group)
        run: uv sync --locked --group evals
      - name: Run brain tier
        run: >-
          uv run python -m evals run --tier brain --suite "$SUITE"
          --max-cost-usd "$MAX_COST_USD" --fingerprints "$FINGERPRINTS"
          --results-dir "$RESULTS_DIR" --skip-if-no-key
      - name: Job summary
        if: always()
        run: cat "$RESULTS_DIR"/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-brain-${{ matrix.suite }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: ignore
          retention-days: 30

  voice:
    name: Voice evals (${{ matrix.suite }})
    needs: [plan, brain]
    # Cheap gate before expensive: never pay for GPT-Live sessions when the brain tier failed.
    # `skipped` is fine: the plan may need voice only (e.g. a voice-prompt-only change).
    if: >-
      !cancelled()
      && needs.plan.outputs.run_voice == 'true'
      && needs.plan.outputs.can_spend == 'true'
      && (needs.brain.result == 'success' || needs.brain.result == 'skipped')
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2 # real-time audio sessions: keep concurrency (and rate limits) modest
      matrix: ${{ fromJSON(needs.plan.outputs.voice_matrix) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUITE: ${{ matrix.suite }}
      FINGERPRINTS: ${{ needs.plan.outputs.voice_fingerprints }}
      MAX_COST_USD: ${{ inputs.max_cost_usd || vars.EVALS_MAX_COST_USD || '3' }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies (with the evals group)
        run: uv sync --locked --group evals
      # Synthesized user turns are deterministic per (text, TTS model, voice): cache them.
      # One cache per suite: matrix jobs sharing a key would race, the first save would win,
      # and every other suite would get an exact-key hit without its audio (and never save).
      # PR runs can read caches from the default branch but only write to their own PR scope.
      - name: Cache synthesized user turns
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: evals/.cache/tts
          key: eval-tts-${{ matrix.suite }}-${{ hashFiles('evals/suites/*.yaml', 'evals/runners/voice.py') }}
          restore-keys: eval-tts-${{ matrix.suite }}-
      - name: Run voice tier
        run: >-
          uv run python -m evals run --tier voice --suite "$SUITE"
          --max-cost-usd "$MAX_COST_USD" --fingerprints "$FINGERPRINTS"
          --results-dir "$RESULTS_DIR" --skip-if-no-key
      - name: Job summary
        if: always()
        run: cat "$RESULTS_DIR"/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-voice-${{ matrix.suite }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: ignore
          retention-days: 30

  # Builds the report with PR code, so it holds no write token (default read-only permissions).
  # `!cancelled()` rather than `always()`: a run cancelled by a newer push must not post a
  # stale report over the new run's comment.
  report:
    name: Report
    needs: [plan, brain, voice]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-plan
      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-results-*
          path: ${{ env.RESULTS_DIR }}
          merge-multiple: true
      - name: Build report
        env:
          GATE_REASON: ${{ needs.plan.outputs.gate_reason }}
          BRAIN_RESULT: ${{ needs.brain.result }}
          VOICE_RESULT: ${{ needs.voice.result }}
          RUN_VOICE: ${{ needs.plan.outputs.run_voice }}
        run: |
          mkdir -p "$RESULTS_DIR"
          notes=()
          [ -n "$GATE_REASON" ] && notes+=(--note "$GATE_REASON")
          if [ "$RUN_VOICE" = "true" ] && [ "$BRAIN_RESULT" = "failure" ]; then
            notes+=(--note "Voice tier not run: brain tier failed (cheap gate before expensive).")
          fi
          notes+=(--note "Jobs: brain=${BRAIN_RESULT}, voice=${VOICE_RESULT}.")
          uv run python -m evals report --results-dir "$RESULTS_DIR" --plan eval-plan.json \
            --output eval-report.md "${notes[@]}"
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 30

  # The only job with a write token. It runs no repository code: it downloads the report
  # built by `report` and posts it as-is; PR content can only shape the comment text.
  comment:
    name: Sticky PR comment
    needs: report
    # Fork PRs get a read-only token; their report lives in the job summary instead.
    if: >-
      !cancelled()
      && needs.report.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # create/update the sticky comment
    steps:
      - name: Download report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-report
      - name: Create or update the sticky comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            // Must match COMMENT_MARKER in evals/report.py.
            const marker = '<!-- gpt-live-evals-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = fs.readFileSync('eval-report.md', 'utf8');
            // GitHub rejects comment bodies over 65,536 characters.
            const limit = 60000;
            if (body.length > limit) {
              body = `${body.slice(0, limit)}\n\n… truncated; full report in the [run summary](${runUrl}).\n`;
            }
            if (!body.startsWith(marker)) body = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // Only ever edit our own comment: match the Actions bot *and* the marker, so a
            // human or another app quoting the marker is never overwritten.
            const mine = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
