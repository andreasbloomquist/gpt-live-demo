# Free, key-less checks on every PR and push to main.
#
# Paid model evals live in evals.yml and only run when the change-impact detector says a
# change can affect agent behavior. Everything here must pass without any secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files via the API
    outputs:
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
      analyzer: ${{ github.event_name == 'push' || steps.filter.outputs.analyzer == 'true' }}
    steps:
      # On pull_request the filter reads the changed files from the API (no checkout needed).
      # Pushes to main run everything, so the filter is skipped there.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            python:
              - 'agent/**'
              - 'evals/**'
              - 'prompts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            analyzer:
              - 'analyzer/**'
              - 'pyproject.toml' # analyzer's ruff config extends the root one
              - '.github/workflows/ci.yml'

  lint:
    name: Lint and typecheck (ruff, mypy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # The evals group brings the OpenAI SDK, so mypy checks evals/ against real types.
      - run: uv sync --locked --group evals
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy agent/voice_agent evals

  test:
    name: Tests (pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group evals
      # agent/tests + evals/tests (the detector tests build throwaway git repos in tmp dirs).
      - run: uv run pytest -q

  prompts:
    name: Prompt render + eval suite check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group evals
      - name: Render every profile (voice + backend) with the real composer
        run: |
          set -euo pipefail
          profiles=$(uv run python -m voice_agent.prompts list | cut -f1)
          test -n "$profiles"
          for profile in $profiles; do
            for target in voice backend; do
              echo "::group::${profile} / ${target}"
              uv run python -m voice_agent.prompts render "$profile" --target "$target"
              echo "::endgroup::"
            done
          done
      - name: Build tool schemas for every registered tool
        run: uv run python -m evals.impact probe --strict
      - name: Validate eval suites against the agent
        run: uv run python -m evals validate
      - name: Suite JSON schema is up to date
        run: |
          uv run python -m evals schema --write
          git diff --exit-code -- evals/suite.schema.json
      - name: Eval dry-run (no network, no keys)
        run: |
          uv run python -m evals run --tier brain --dry-run
          uv run python -m evals run --tier voice --dry-run

  analyzer:
    # A separate uv project with its own lockfile: it deploys independently of the agent.
    name: Call analyzer (lint, typecheck, tests, seed smoke test)
    needs: changes
    if: needs.changes.outputs.analyzer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy call_analyzer tests
      - run: uv run pytest -q
      - name: Seed demo calls with the offline heuristic (no keys)
        env:
          ANALYZER_PROVIDER: heuristic
          ANALYZER_DB_PATH: ${{ runner.temp }}/calls.db
        run: uv run python -m call_analyzer seed

  frontend:
    name: Frontend (lint, typecheck, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders: the token route reads these at request time, never at build time.
      LIVEKIT_URL: wss://placeholder.livekit.cloud
      LIVEKIT_API_KEY: placeholder
      LIVEKIT_API_SECRET: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
